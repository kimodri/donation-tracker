            <input type="hidden" name="organizer" value="{{ organizer }}">
            <span class="title">Select What You Need</span>
            <div> <!-- Item ID dapat yung value ng mga checklists dito-->
                <div class="request-item">
                    <div class="checkbox-label-group">
                        <input type="checkbox" id="rice-cb">
                        <label for="rice-cb">Rice (Sacks)</label>
                    </div>
                    <input type="number" id="rice-num" disabled>
                </div>


                <div class="request-item">
                    <div class="checkbox-label-group">

                        <label for="clothes-cb">Clothes</label>
                    </div>
                    <input type="number" id="clothes-num" disabled>
                </div>


                <div class="request-item">
                    <div class="checkbox-label-group">

                    </div>

                </div>

            <span class="title">Message</span>
            <textarea name="message" placeholder="Write your message here..."></textarea>
