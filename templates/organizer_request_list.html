{% block body %}

<body>

    <div class="dashboard-container">
        <!-- NAVIGATION -->
        <nav class="dashboard-nav">
            <div class="logo" style="margin-left: 10px;">
                <a href="#"><img id="doneate-logo" src="/static/img/doneate_logo_2.png" alt="DONEate logo"></a>
            </div>
            <div class="dashboard-nav-items">
                <p>DASHBOARD</p>
                <a href="#">
                    <p>Overview</p>
                </a>
                <a href="organizer_campaign_form.html">
                    <p>Campaigns</p>
                </a>
                <a href="organizer_request_list.html">
                    <p>Requests</p>
                </a>
                <a href="organizer_update_form.html">

                </a>
                <a href="#">
                    <p>Profile</p>
                </a>
                <a href="#">
                    <p>Logout</p>
                </a>
            </div>
        </nav>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <h1 class="main-content-title">Requests</h1>

            <div class="donor-center-container">
                    {% if requests %}
                        {% for request in requests%}
                        <div class="donor-center-div update">

                            <div class="update-header">
                                <h4 class="organizer-name-update">{{request.representative.Name}}</h4>

                                <!-- lagay ka actio url_for -->
                                <a href = "{{ url_for(delete_request, request_id = request.RequestID) }}">
                                    <button class="delete-btn">Delete</button>
                                </a>
                            </div>
                            <p class="update-message">{{request.Message}}</p>
                            </div>
                        {% endfor %}
                    {% else %}
                        <div class="donor-center-div update">
                            <p class="update-message">No pending requests.</p>
                        </div>
                    {% endif %}
                </div>
