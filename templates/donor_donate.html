{% extends "layout.html" %}

{% block body %}
<body>

  {% include "navigation.html" %}

    <h1 id="donor-page-title">Donate</h1>

    <div class="donor-center-container">
        
        {% if role == 'donor' %}
        <div id="donate-bttn-div">
            <a href="{{ url_for('donate_form') }}"></a>    
                <button class="submit-bttn">Donate</button>
            </a>    
        </div>
        {% endif %}

        <!-- <button href="#" class="submit-bttn donate">Donate</button> -->
        {% if organizers %}
            {% for organizer in organizers %}
                <div class="donor-center-div">
                    <h3 class="organizer-name">{{organizer.Name}}</h3>
                        <a href="{{ url_for('donor_org_profile', organizer_id=organizer.OrganizerID) }}">
                            <button class="feedback-bttn">View</button>  
                        </a> 
                </div>           
            {% endfor %}
        {% else %}
            <div class="donor-center-div">
                <p>No organizers found!</p>
            </div>
        {% endif %}
      

        <!-- <div class="donor-center-div">
            <h3 class="organizer-name">Joe Doe</h3>
            <button onclick="window.location.href='donor_view_organizer.html'" class="feedback-bttn">View</button>
        </div>

        <div class="donor-center-div">
            <h3 class="organizer-name">Alice Johnson</h3>
            <button onclick="window.location.href='donor_view_organizer.html'" class="feedback-bttn">View</button>
        </div> -->
    </div>

    <script src="/static/javascript.js"></script>
</body>

{% endblock %}
