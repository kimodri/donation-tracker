{% extends "layout.html" %}

{% block body %}
    <h1>Feedback an Organizer!</h1>
    <form id="feedbackForm" action = '/feedback' method = 'post'>
        <div>
          <label for="organizer">Feedback About:</label>
          <select id="organizer" name="organizer" required>
            <option value="" disabled selected>Select Organizer</option>
            {% for sport in sports %}
                <option value="{{ organizer_id }}">{{ organizer }}</option> <!-- Di pa sure, maybe name lang!-->
            {% endfor %}
            </select>
        </div>
      
        <!-- <div>
          <label for="donorName">Your Name (Optional):</label>
          <input type="text" id="donorName" name="donorName" placeholder="Your name if you wish to provide it">
        </div> -->
      
        <div>
          <label for="rating">Overall Experience (Optional):</label>
          <select id="rating" name="rating">
            <option value="" disabled selected>Select Rating</option>
            <option value="5">Excellent</option>
            <option value="4">Very Good</option>
            <option value="3">Good</option>
            <option value="2">Fair</option>
            <option value="1">Poor</option>
          </select>
        </div> 
      
        <div>
          <label for="comments">Feedback / Comments:</label>
          <textarea id="comments" name="comments" rows="5" placeholder="Please share your feedback about the selected organizer."></textarea>
        </div>
      
        <button type="submit">Submit Feedback</button>
      </form>
    
{% endblock %}
