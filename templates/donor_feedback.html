    <h1 id="donor-organizer-title">Organizers</h1>

    <div class="donor-center-container">

            {% for organizer in organizers %}
                {% if organizer %}
                    <div class="donor-center-div">
                    <h3 class="organizer-name">{{ organizer }}</h3>
                        <button class="feedback-bttn">Send Feedback</button>
                    </div>
                {% else %}
                    <h3 class = 'organizer-name'>You have not donated to anyone yet.</h3>
                {% endif %}

    <div class="feedback-modal">
        <div class="feedback-modal-overlay"></div>

        <section class="feedback-modal-content" role="dialog" aria-modal="true" aria-labelledby="feedback-title">
            <header class="feedback-modal-header">
                <h2 id="feedback-title">Submit Feedback</h2>
                <button class="feedback-modal-close" aria-label="Close feedback form">×</button>
            </header>

            <form class="feedback-modal-form" name="feedback" action="{{ url_for('donor_submit_feedback') }}", method = 'post'>
                <!-- <p><strong>Organizer:</strong> John Smith</p> -->

                <!-- TEMPORARY ONLY, NOT SURE IF IM GOING TO USE JINJA -->
                <p><strong>Organizer:</strong> <span class="organizer-name"></span></p>
                
                <!-- so we can get the organizer name -->
                <input type="hidden" name="organizer_name" id="organizer-name-input">

                <label for="rating">How would you rate my service?</label>
                <div class="rating">
                    <input type="radio" name="rating" id="star5" value="5">
                    <label for="star5" title="5 stars"></label>

                    <input type="radio" name="rating" id="star4" value="4">
                    <label for="star4" title="4 stars"></label>

                    <input type="radio" name="rating" id="star3" value="3">
                    <label for="star3" title="3 stars"></label>

                    <input type="radio" name="rating" id="star2" value="2">
                    <label for="star2" title="2 stars"></label>

                    <input type="radio" name="rating" id="star1" value="1">
                    <label for="star1" title="1 star"></label>
                </div>

                <label for="feedback-textarea">Your Feedback</label>

                <textarea name="message" placeholder="Write your message here..."></textarea>

                <div class="button-group">
                    <button type="reset" class="cancel-bttn">Cancel</button>
                    <button type="submit" class="submit-bttn">Submit</button>
                </div>
            </form>
        </section>
    </div>
    
    <script src="{{ url_for('static', filename='javascript.js') }}"></script>
</body>
