{% extends "layout.html" %}

{% block body %}
<body>
    <div class="login-body">
        <!-- FOR LOGIN -->
        <div class="login-container">
            <div class="form-box active" id="login-form">
                <form action="/thank-you">
                    <h2 class="login-h2">Login</h2>
                    <input class="login-input" type="text" name="username" placeholder="username" required>
                    <input class="login-input" type="password" name="password" placeholder="Password" required>
                    <button class="login-submit-btn" type="submit" name="login">Login</button>
                    <p class="login-p">Need an account? <a href="#" onclick="showForm('signup-form')">SIGN UP</a></p>
                </form>
            </div>

            <!-- FOR SIGN UP -->
            <div class="form-box" id="signup-form">
                <form action="/signin" method = "post">
                    <h2 class="login-h2">Sign Up</h2>
                    <input class="login-input" type="text" name="username" placeholder="Username" required>
                    <input class="login-input" type="password" name="password" placeholder="Password" required>
                    <select name="role" id="role" required>
                        <option value="">--Select Role--</option>
                        <option value="donor">Donor</option>
                        <option value="representative">Representative</option>
                        <option value="organizer">Organizer</option>
                    </select>
                    <button class="login-submit-btn" type="submit" name="signup">Sign Up</button>
                    <p class="login-p">Already have an account? <a href="#" onclick="showForm('login-form')">LOG IN</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='javascript.js') }}"></script>
</body>
{% endblock %}
