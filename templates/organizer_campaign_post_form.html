{% extends "layout.html" %}

{% block body %}

<body>

    <div class="dashboard-container">
        <!-- NAVIGATION -->
    {% include "org_nav.html" %}

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <h1 class="main-content-title">Campaigns</h1> 
            <!-- Di ko alam kung ano maganda itawag dito HAHAHAH, ikaw na lang magbago : ) -->

            <div class="request-form-container">
                <header>Campaign Post Form</header>
                <form id="request-form" method = 'post' action="/post_campaign/submit">
                    <span class="title">Campaign Details</span>
                    <div class="fields">
                        <div class="input-field">
                            <label>Campaign Title</label>
                            <input type="text" name = 'title' placeholder="Enter campaign title" required>
                        </div>

                        <div class="input-field">
                            <label>Location</label>
                            <input type="text" name = "location" placeholder="Enter location" required>
                        </div>

                        <div class="input-field">
                            <label>Campaign Description</label>
                            <textarea name="description"
                                placeholder="Write your description here..."></textarea>
                        </div>
                    </div>

                    <div class="input-field">
                        <label>Is this campaign urgent?</label>
                        <div class="radio-group">
                            <label><input type="radio" name="urgency" value="yes" required> Yes</label>
                            <label><input type="radio" name="urgency" value="no"> No</label>
                        </div>
                    </div>

                    <span class="title">Requested Items</span>
                    <div>
                        <div class="request-item">
                            <div class="checkbox-label-group">
                                <input type="checkbox" name = "items" value = "rice" id="rice-cb">
                                <label for="rice-cb">Rice</label>
                            </div>
                            <input type="number" name = "rice_quantity" id="rice-num" disabled>
                        </div>
                        <div class="request-item">
                            <div class="checkbox-label-group">
                                <input type="checkbox" id="clothes-cb" name = "items" value = "clothes">
                                <label for="clothes-cb">Clothes</label>
                            </div>
                            <input type="number" id="clothes-num" name = "clothes_quantity" disabled>
                        </div>
                        <div class="request-item">
                            <div class="checkbox-label-group">
                                <input type="checkbox" name="items" value="canned goods" id="canned-goods-cb">
                                <label for="canned-goods-cb">Canned Goods</label>
                            </div>
                            <input type="number" id="canned-goods-num" name = "canned_goods_quantity" disabled>
                        </div>
                        <div class="request-item">
                            <div class="checkbox-label-group">
                                <input type="checkbox" name="items" value="medical kits" id="medical-kits-cb">
                                <label for="medical-kits-cb">Medical Kits</label>
                            </div>
                            <input type="number" id="medical-kits-num" name = "medical_kits_quantity" disabled>
                        </div>
                    </div>

                    <div class="button-group">
                        <!-- <button type="reset" class="cancel-bttn">Cancel</button> -->
                        <button type="submit" class="submit-bttn">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="/static/javascript.js"></script>
</body>

{% endblock %}
